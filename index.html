<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Control Nutricional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center pt-4">
            <h1 class="text-2xl font-black tracking-tight text-emerald-400">NutriControl AI</h1>
            <button onclick="toggleConfig()" class="bg-slate-800 text-xs px-3 py-1.5 rounded-full border border-slate-700 hover:bg-slate-700">⚙️ Configuración</button>
        </header>

        <!-- Config API Box -->
        <div id="config-box" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
            <label class="block text-xs font-semibold text-slate-400">Tu Clave API de Google AI Studio:</label>
            <input type="password" id="api-key-input" placeholder="Pega tu clave aquí..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-xl text-sm">Guardar Clave</button>

            <div class="border-t border-slate-800 pt-3 space-y-3">
                <h2 class="text-sm font-bold text-slate-300">Perfil metabólico</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="text-xs text-slate-400">Sexo
                        <select id="profile-sex" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="male">Hombre</option>
                            <option value="female">Mujer</option>
                        </select>
                    </label>
                    <label class="text-xs text-slate-400">Edad (años)
                        <input type="number" id="profile-age" min="1" max="120" step="1" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </label>
                    <label class="text-xs text-slate-400">Altura (cm)
                        <input type="number" id="profile-height" min="50" max="250" step="0.1" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </label>
                    <label class="text-xs text-slate-400">Factor de actividad
                        <select id="profile-activity" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="1.2">Sedentario (x1.2)</option>
                            <option value="1.375">Ligero (x1.375)</option>
                            <option value="1.55">Moderado (x1.55)</option>
                            <option value="1.725">Activo (x1.725)</option>
                            <option value="1.9">Muy activo (x1.9)</option>
                        </select>
                    </label>
                </div>
                <button onclick="saveProfile()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-xl text-sm">Guardar Perfil</button>
            </div>
        </div>

        <!-- Panel Principal / Métricas -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Ingerido Hoy</p>
                <p id="today-calories" class="text-2xl font-black text-white mt-1">0 <span class="text-xs font-normal text-slate-500">kcal</span></p>
            </div>
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Déficit de hoy</p>
                <p id="weekly-deficit" class="text-2xl font-black text-emerald-400 mt-1">—</p>
            </div>
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">TMB · En reposo</p>
                <p id="basal-calories" class="text-2xl font-black text-white mt-1">—</p>
                <p id="weight-basis" class="text-[10px] text-slate-500 mt-1">Completa tu perfil</p>
            </div>
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">TDEE · Gasto diario total</p>
                <p id="tdee-calories" class="text-2xl font-black text-emerald-400 mt-1">—</p>
                <p class="text-[10px] text-slate-500 mt-1">Según tu actividad</p>
            </div>
        </div>

        <!-- Input Box / Formulario -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4">
            <h2 class="text-sm font-bold text-slate-300">Registrar Comida o Peso</h2>
            
            <textarea id="food-input" rows="3" placeholder="¿Qué has comido? (ej: bocadillo de filete empanado con ketchup...)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500 resize-none"></textarea>

            <label class="block text-xs text-slate-400">Momento del día
                <select id="meal-type" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <option value="auto">Automático según la hora</option>
                    <option value="breakfast">Desayuno</option>
                    <option value="snack">Entre comidas</option>
                    <option value="lunch">Almuerzo</option>
                    <option value="dinner">Cena</option>
                </select>
            </label>

            <div class="flex items-center justify-between">
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    📷 <span>Subir Foto</span>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>
                <span id="file-name" class="text-xs text-slate-500 truncate max-w-[150px]">Ninguna foto</span>
            </div>

            <div class="flex gap-2 pt-2">
                <input type="number" id="weight-input" placeholder="Peso (kg)" step="0.1" class="w-1/3 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                <button onclick="submitLog()" id="submit-btn" class="w-2/3 bg-emerald-600 hover:bg-emerald-500 font-bold text-white py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-950/50">Registrar con IA</button>
            </div>
        </div>

        <!-- Historial y Análisis Semanal -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-300">Historial Reciente</h3>
                <button onclick="generateWeeklyReview()" class="text-xs text-emerald-400 hover:underline">✨ Resumen IA Semanal</button>
            </div>
            <div id="ai-review-box" class="hidden bg-emerald-950/30 border border-emerald-900/50 p-4 rounded-2xl text-xs text-emerald-200 leading-relaxed"></div>
            <div id="logs-list" class="space-y-2">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PROFILE = { sex: 'male', age: 18, height: 186, activity: 1.2 };
        const DEFAULT_WEIGHT = 96;
        const GEMINI_MODEL = 'gemini-3.5-flash-lite';
        const ACTIVITY_FACTORS = [1.2, 1.375, 1.55, 1.725, 1.9];
        const MEAL_TYPES = ['breakfast', 'snack', 'lunch', 'dinner'];
        const MEAL_LABELS = {
            breakfast: 'Desayuno',
            snack: 'Entre comidas',
            lunch: 'Almuerzo',
            dinner: 'Cena'
        };
        function readStoredJSON(key, fallback) {
            try {
                const value = localStorage.getItem(key);
                return value ? JSON.parse(value) : fallback;
            } catch (error) {
                console.error(`No se pudo leer ${key} del almacenamiento local.`, error);
                return fallback;
            }
        }

        let logs = readStoredJSON('nutri_logs', []);
        if(!Array.isArray(logs)) logs = [];
        logs = logs.filter(log => log && typeof log === 'object');
        let profile = readStoredJSON('nutri_profile', null);

        if(profile) {
            document.getElementById('profile-sex').value = profile.sex || DEFAULT_PROFILE.sex;
            document.getElementById('profile-age').value = profile.age || '';
            document.getElementById('profile-height').value = profile.height || '';
            document.getElementById('profile-activity').value = profile.activity || DEFAULT_PROFILE.activity;
        }

        function toggleConfig() {
            document.getElementById('config-box').classList.toggle('hidden');
        }

        function saveProfile() {
            const sex = document.getElementById('profile-sex').value;
            const age = Number(document.getElementById('profile-age').value);
            const height = Number(document.getElementById('profile-height').value);
            const activity = Number(document.getElementById('profile-activity').value);

            if(!['male', 'female'].includes(sex) || !Number.isInteger(age) || age < 1 || age > 120 ||
                !Number.isFinite(height) || height < 50 || height > 250 ||
                !ACTIVITY_FACTORS.includes(activity)) {
                alert('Introduce una edad y altura válidas y revisa tu perfil.');
                return;
            }

            profile = { sex, age, height, activity };
            try {
                localStorage.setItem('nutri_profile', JSON.stringify(profile));
                updateUI();
                alert('¡Perfil guardado correctamente!');
            } catch (error) {
                console.error('No se pudo guardar el perfil.', error);
                alert('No se pudo guardar el perfil en el navegador.');
            }
        }

        function getDailyEnergy() {
            const storedProfile = profile && typeof profile === 'object' ? profile : {};
            const age = Number.isInteger(Number(storedProfile.age)) && Number(storedProfile.age) >= 1 && Number(storedProfile.age) <= 120
                ? Number(storedProfile.age) : DEFAULT_PROFILE.age;
            const height = Number.isFinite(Number(storedProfile.height)) && Number(storedProfile.height) >= 50 && Number(storedProfile.height) <= 250
                ? Number(storedProfile.height) : DEFAULT_PROFILE.height;
            const sex = ['male', 'female'].includes(storedProfile.sex) ? storedProfile.sex : DEFAULT_PROFILE.sex;
            const activity = ACTIVITY_FACTORS.includes(Number(storedProfile.activity))
                ? Number(storedProfile.activity) : DEFAULT_PROFILE.activity;

            const latestWeight = logs.find(log => Number.isFinite(Number(log?.weight)) && Number(log.weight) > 0);
            const weight = latestWeight ? Number(latestWeight.weight) : DEFAULT_WEIGHT;
            const tmb = (10 * weight) + (6.25 * height) - (5 * age) + (sex === 'female' ? -161 : 5);

            return { tmb, tdee: tmb * activity, weight, hasRecordedWeight: Boolean(latestWeight) };
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if(!key) {
                alert('Introduce una clave API. La clave guardada no se ha modificado.');
                return;
            }
            try {
                localStorage.setItem('gemini_api_key', key);
                alert('¡Clave guardada correctamente!');
                toggleConfig();
            } catch (error) {
                console.error('No se pudo guardar la clave API.', error);
                alert('No se pudo guardar la clave API en el navegador.');
            }
        }

        document.getElementById('image-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('file-name').innerText = file.name;
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    if(typeof reader.result !== 'string' || !reader.result.includes(',')) {
                        reject(new Error('No se pudo leer la imagen.'));
                        return;
                    }
                    resolve(reader.result.split(',')[1]);
                };
                reader.onerror = () => reject(reader.error || new Error('No se pudo leer la imagen.'));
            });
        }

        async function submitLog() {
            const text = document.getElementById('food-input').value.trim();
            const weightValue = document.getElementById('weight-input').value.trim();
            const imageFile = document.getElementById('image-input').files[0];
            const weight = weightValue ? Number(weightValue) : null;

            if(!text && !imageFile && weight === null) {
                alert('Escribe algo, sube una foto o pon tu peso.');
                return;
            }
            if(weightValue && (!Number.isFinite(weight) || weight <= 0 || weight > 500)) {
                alert('Introduce un peso válido en kg.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = 'Calculando con IA...';
            btn.disabled = true;

            try {
                let apiKey = '';
                let apiKeyError = null;
                try {
                    apiKey = localStorage.getItem('gemini_api_key')?.trim() || '';
                } catch (error) {
                    apiKeyError = error;
                    console.error('No se pudo leer la clave API.', error);
                }
                const needsAI = Boolean(text || imageFile);
                let result = null;
                let aiError = null;

                if(needsAI && apiKey) {
                    try {
                        const energy = getDailyEnergy();
                        const energyContext = `TDEE diario estimado del usuario: ${Math.round(energy.tdee)} kcal. `;
                        const prompt = `Actúa como un experto en nutrición. ${energyContext}Analiza esto y devuelve ÚNICAMENTE un objeto JSON estricto sin markdown (sin comillas de código ni explicaciones) con este formato exacto: {"calories": número_entero_estimado, "summary": "breve resumen de 5 palabras"}. Si solo es peso, pon calories a 0. Entrada del usuario: ${text}`;
                        const contents = [{ text: prompt }];

                        if(imageFile) {
                            contents.push({
                                inlineData: {
                                    mimeType: imageFile.type,
                                    data: await fileToBase64(imageFile)
                                }
                            });
                        }

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: contents }] })
                        });
                        const data = await response.json();
                        if(!response.ok) {
                            throw new Error(data?.error?.message || `La API respondió con estado ${response.status}.`);
                        }
                        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if(typeof rawText !== 'string') throw new Error('La API no devolvió un análisis válido.');
                        const parsed = JSON.parse(rawText.replace(/```json/gi, '').replace(/```/g, '').trim());
                        const calories = Number(parsed.calories);
                        if(!Number.isFinite(calories) || calories < 0) throw new Error('El análisis no contiene calorías válidas.');
                        result = {
                            calories: Math.round(calories),
                            summary: typeof parsed.summary === 'string' && parsed.summary.trim()
                                ? parsed.summary.trim() : 'Comida registrada'
                        };
                    } catch (error) {
                        aiError = error;
                        console.error('No se pudo analizar el registro con IA.', error);
                    }
                } else if(needsAI) {
                    aiError = apiKeyError || new Error('No hay una clave API configurada.');
                }

                if(needsAI && !result && weight === null) {
                    alert(apiKey
                        ? `No se pudo analizar el registro con IA. Tu registro no se ha guardado.${aiError?.message ? ` Detalle: ${aiError.message}` : ''}`
                        : apiKeyError
                            ? 'No se pudo leer la clave API del navegador. Puedes guardar el peso sin usar la IA.'
                            : 'Configura tu API Key para registrar comidas. Puedes guardar el peso sin usar la IA.');
                    if(!apiKey) toggleConfig();
                    return;
                }

                const now = new Date();
                const date = getLocalDateKey(now);
                const selectedMeal = document.getElementById('meal-type').value;
                const meal = MEAL_TYPES.includes(selectedMeal) ? selectedMeal : getMealTypeForTime(now);
                logs.unshift({
                    date,
                    timestamp: now.getTime(),
                    meal,
                    text: result
                        ? (text || (imageFile ? 'Foto de comida' : 'Registro de peso'))
                        : 'Registro de peso',
                    calories: result ? result.calories : 0,
                    weight,
                    summary: result ? result.summary : 'Peso registrado'
                });
                localStorage.setItem('nutri_logs', JSON.stringify(logs));

                if(result) document.getElementById('food-input').value = '';
                document.getElementById('weight-input').value = '';
                if(result && imageFile) document.getElementById('image-input').value = '';
                if(result && imageFile) document.getElementById('file-name').innerText = 'Ninguna foto';
                updateUI();
                if(aiError && weight !== null) {
                    alert(`El peso se guardó correctamente, pero no se pudo analizar la comida. ${apiKeyError ? 'No se pudo leer la clave API.' : 'Revisa la clave o la conexión e inténtalo de nuevo.'}`);
                }
            } catch (error) {
                console.error('No se pudo guardar el registro.', error);
                alert('No se pudo guardar el registro. Comprueba el almacenamiento del navegador e inténtalo de nuevo.');
            } finally {
                btn.innerText = 'Registrar con IA';
                btn.disabled = false;
            }
        }

        function getLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getMealTypeForTime(date) {
            const hour = date.getHours();
            if(hour >= 5 && hour < 11) return 'breakfast';
            if(hour >= 11 && hour < 17) return 'lunch';
            return 'dinner';
        }

        function getLogMealType(log) {
            if(MEAL_TYPES.includes(log.meal)) return log.meal;
            const timestamp = Number(log.timestamp);
            return Number.isFinite(timestamp) && timestamp > 0
                ? getMealTypeForTime(new Date(timestamp))
                : 'breakfast';
        }

        function formatLogTime(log) {
            const timestamp = Number(log.timestamp);
            return Number.isFinite(timestamp) && timestamp > 0
                ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : '';
        }

        function getLogDateKey(log) {
            if(Number.isFinite(Number(log.timestamp)) && Number(log.timestamp) > 0) {
                return getLocalDateKey(new Date(Number(log.timestamp)));
            }
            if(typeof log.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(log.date)) return log.date;
            const parsedDate = new Date(log.date);
            return Number.isNaN(parsedDate.getTime()) ? '' : getLocalDateKey(parsedDate);
        }

        function formatLogDate(log) {
            if(typeof log.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(log.date)) {
                const [year, month, day] = log.date.split('-').map(Number);
                return new Date(year, month - 1, day).toLocaleDateString();
            }
            return log.date || '';
        }

        function updateUI() {
            const today = getLocalDateKey(new Date());
            const todayLogs = logs.filter(log => getLogDateKey(log) === today);
            const todayCals = todayLogs.reduce((acc, log) => {
                const calories = Number(log.calories);
                return acc + (Number.isFinite(calories) && calories > 0 ? calories : 0);
            }, 0);
            document.getElementById('today-calories').innerHTML = `${todayCals} <span class="text-xs font-normal text-slate-500">kcal</span>`;

            const energy = getDailyEnergy();
            const basalEl = document.getElementById('basal-calories');
            const tdeeEl = document.getElementById('tdee-calories');
            const weightBasisEl = document.getElementById('weight-basis');
            const deficitEl = document.getElementById('weekly-deficit');

            basalEl.innerHTML = `${Math.round(energy.tmb)} <span class="text-xs font-normal text-slate-500">kcal</span>`;
            tdeeEl.innerHTML = `${Math.round(energy.tdee)} <span class="text-xs font-normal text-slate-500">kcal</span>`;
            weightBasisEl.innerText = energy.hasRecordedWeight
                ? `Con tu último peso: ${energy.weight} kg`
                : `Peso estimado: ${DEFAULT_WEIGHT} kg`;

            const dailyDeficit = Math.round(energy.tdee - todayCals);
            deficitEl.innerHTML = `${dailyDeficit} <span class="text-xs font-normal text-slate-500">kcal</span>`;
            deficitEl.className = `text-2xl font-black mt-1 ${dailyDeficit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            const listEl = document.getElementById('logs-list');
            const logsByDate = new Map();
            logs.forEach(log => {
                const dateKey = getLogDateKey(log) || 'unknown';
                if(!logsByDate.has(dateKey)) logsByDate.set(dateKey, []);
                logsByDate.get(dateKey).push(log);
            });
            listEl.innerHTML = [...logsByDate.entries()].map(([dateKey, dayLogs]) => {
                const mealSections = MEAL_TYPES.map(mealType => {
                    const mealLogs = dayLogs.filter(log => getLogMealType(log) === mealType);
                    if(!mealLogs.length) return '';
                    return `
                        <section class="space-y-2">
                            <h4 class="text-xs font-bold uppercase tracking-wide text-emerald-400">${MEAL_LABELS[mealType]}</h4>
                            ${mealLogs.map(log => `
                                <div class="bg-slate-900 border border-slate-800/60 p-3 rounded-xl flex justify-between items-center text-xs">
                                    <div>
                                        <p class="font-bold text-slate-200">${log.text}</p>
                                        <p class="text-slate-500">${formatLogTime(log)} ${Number(log.weight) > 0 ? `• ⚖️ ${log.weight}kg` : ''}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="font-bold text-emerald-400">+${Number(log.calories) || 0} kcal</span>
                                    </div>
                                </div>
                            `).join('')}
                        </section>
                    `;
                }).join('');
                return `
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-slate-400">${dayLogs[0] ? formatLogDate(dayLogs[0]) : dateKey}</h3>
                        ${mealSections}
                    </div>
                `;
            }).join('');
        }

        function scheduleDailyRefresh() {
            const now = new Date();
            const nextDay = new Date(now);
            nextDay.setHours(24, 0, 0, 50);
            window.setTimeout(() => {
                updateUI();
                scheduleDailyRefresh();
            }, Math.max(1000, nextDay.getTime() - now.getTime()));
        }

        document.addEventListener('visibilitychange', () => {
            if(!document.hidden) updateUI();
        });
        window.addEventListener('focus', updateUI);

        async function generateWeeklyReview() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) { alert('Configura tu API Key primero.'); return; }
            
            const reviewBox = document.getElementById('ai-review-box');
            reviewBox.classList.remove('hidden');
            reviewBox.innerText = 'Analizando tu semana tipo Spotify Wrapped...';

            try {
                const energy = getDailyEnergy();
                const energyContext = energy
                    ? `El TDEE diario estimado es ${Math.round(energy.tdee)} kcal; úsalo como referencia al recomendar comidas. `
                    : '';
                const prompt = `Analiza estos registros nutricionales de un estudiante y haz un resumen estilo "Spotify Wrapped": menciona su mayor acierto, su mayor pecado/exceso y recomienda una mejora concreta en sus comidas usando su gasto diario como referencia. ${energyContext}Datos: ${JSON.stringify(logs)}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if(!response.ok) {
                    throw new Error(data?.error?.message || `La API respondió con estado ${response.status}.`);
                }
                const review = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if(typeof review !== 'string') throw new Error('La API no devolvió un resumen válido.');
                reviewBox.innerText = review;
            } catch (e) {
                console.error('No se pudo generar el resumen semanal con IA.', e);
                reviewBox.innerText = e instanceof Error ? `Error al generar el resumen: ${e.message}` : 'Error al generar el resumen.';
            }
        }

        updateUI();
        scheduleDailyRefresh();
    </script>
</body>
</html>
