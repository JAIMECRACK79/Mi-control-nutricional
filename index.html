<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Control Nutricional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center pt-4">
            <h1 class="text-2xl font-black tracking-tight text-emerald-400">NutriControl AI</h1>
            <button onclick="toggleConfig()" class="bg-slate-800 text-xs px-3 py-1.5 rounded-full border border-slate-700 hover:bg-slate-700">⚙️ Configuración</button>
        </header>

        <!-- Config API Box -->
        <div id="config-box" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
            <label class="block text-xs font-semibold text-slate-400">Tu Clave API de Google AI Studio:</label>
            <input type="password" id="api-key-input" placeholder="Pega tu clave aquí..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-xl text-sm">Guardar Clave</button>

            <div class="border-t border-slate-800 pt-3 space-y-3">
                <h2 class="text-sm font-bold text-slate-300">Perfil metabólico</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="text-xs text-slate-400">Sexo
                        <select id="profile-sex" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="male">Hombre</option>
                            <option value="female">Mujer</option>
                        </select>
                    </label>
                    <label class="text-xs text-slate-400">Edad (años)
                        <input type="number" id="profile-age" min="1" max="120" step="1" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </label>
                    <label class="text-xs text-slate-400">Altura (cm)
                        <input type="number" id="profile-height" min="50" max="250" step="0.1" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </label>
                    <label class="text-xs text-slate-400">Factor de actividad
                        <select id="profile-activity" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="1.2">Sedentario (x1.2)</option>
                            <option value="1.375">Ligero (x1.375)</option>
                            <option value="1.55">Moderado (x1.55)</option>
                            <option value="1.725">Activo (x1.725)</option>
                            <option value="1.9">Muy activo (x1.9)</option>
                        </select>
                    </label>
                </div>
                <button onclick="saveProfile()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-xl text-sm">Guardar Perfil</button>
            </div>
        </div>

        <!-- Panel Principal / Métricas -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Ingerido Hoy</p>
                <p id="today-calories" class="text-2xl font-black text-white mt-1">0 <span class="text-xs font-normal text-slate-500">kcal</span></p>
            </div>
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">Déficit Acumulado</p>
                <p id="weekly-deficit" class="text-2xl font-black text-emerald-400 mt-1">—</p>
            </div>
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">TMB · En reposo</p>
                <p id="basal-calories" class="text-2xl font-black text-white mt-1">—</p>
                <p id="weight-basis" class="text-[10px] text-slate-500 mt-1">Completa tu perfil</p>
            </div>
            <div class="bg-slate-900 border border-slate-800/80 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 font-medium">TDEE · Gasto diario total</p>
                <p id="tdee-calories" class="text-2xl font-black text-emerald-400 mt-1">—</p>
                <p class="text-[10px] text-slate-500 mt-1">Según tu actividad</p>
            </div>
        </div>

        <!-- Input Box / Formulario -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4">
            <h2 class="text-sm font-bold text-slate-300">Registrar Comida o Peso</h2>
            
            <textarea id="food-input" rows="3" placeholder="¿Qué has comido? (ej: bocadillo de filete empanado con ketchup...)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500 resize-none"></textarea>

            <div class="flex items-center justify-between">
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                    📷 <span>Subir Foto</span>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>
                <span id="file-name" class="text-xs text-slate-500 truncate max-w-[150px]">Ninguna foto</span>
            </div>

            <div class="flex gap-2 pt-2">
                <input type="number" id="weight-input" placeholder="Peso (kg)" step="0.1" class="w-1/3 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                <button onclick="submitLog()" id="submit-btn" class="w-2/3 bg-emerald-600 hover:bg-emerald-500 font-bold text-white py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-950/50">Registrar con IA</button>
            </div>
        </div>

        <!-- Historial y Análisis Semanal -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-300">Historial Reciente</h3>
                <button onclick="generateWeeklyReview()" class="text-xs text-emerald-400 hover:underline">✨ Resumen IA Semanal</button>
            </div>
            <div id="ai-review-box" class="hidden bg-emerald-950/30 border border-emerald-900/50 p-4 rounded-2xl text-xs text-emerald-200 leading-relaxed"></div>
            <div id="logs-list" class="space-y-2">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_WEIGHT = 70;
        const ACTIVITY_FACTORS = [1.2, 1.375, 1.55, 1.725, 1.9];
        let logs = JSON.parse(localStorage.getItem('nutri_logs') || '[]');
        let profile = JSON.parse(localStorage.getItem('nutri_profile') || 'null');

        if(profile) {
            document.getElementById('profile-sex').value = profile.sex;
            document.getElementById('profile-age').value = profile.age;
            document.getElementById('profile-height').value = profile.height;
            document.getElementById('profile-activity').value = profile.activity;
        }

        function toggleConfig() {
            document.getElementById('config-box').classList.toggle('hidden');
        }

        function saveProfile() {
            const sex = document.getElementById('profile-sex').value;
            const age = Number(document.getElementById('profile-age').value);
            const height = Number(document.getElementById('profile-height').value);
            const activity = Number(document.getElementById('profile-activity').value);

            if(!['male', 'female'].includes(sex) || !Number.isInteger(age) || age < 1 || age > 120 ||
                !Number.isFinite(height) || height < 50 || height > 250 ||
                !ACTIVITY_FACTORS.includes(activity)) {
                alert('Introduce una edad y altura válidas y revisa tu perfil.');
                return;
            }

            profile = { sex, age, height, activity };
            localStorage.setItem('nutri_profile', JSON.stringify(profile));
            updateUI();
            alert('¡Perfil guardado correctamente!');
        }

        function getDailyEnergy() {
            if(!profile || !Number.isInteger(profile.age) || profile.age < 1 || profile.age > 120 ||
                !Number.isFinite(profile.height) || profile.height < 50 || profile.height > 250 ||
                !ACTIVITY_FACTORS.includes(profile.activity) || !['male', 'female'].includes(profile.sex)) {
                return null;
            }

            const latestWeight = logs.find(log => Number.isFinite(Number(log.weight)) && Number(log.weight) > 0);
            const weight = latestWeight ? Number(latestWeight.weight) : DEFAULT_WEIGHT;
            const tmb = (10 * weight) + (6.25 * profile.height) - (5 * profile.age) +
                (profile.sex === 'female' ? -161 : 5);

            return { tmb, tdee: tmb * profile.activity, weight, hasRecordedWeight: Boolean(latestWeight) };
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('¡Clave guardada correctamente!');
                toggleConfig();
            }
        }

        document.getElementById('image-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('file-name').innerText = file.name;
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function submitLog() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) {
                alert('Por favor, configura tu API Key arriba en "⚙️ Config API".');
                toggleConfig();
                return;
            }

            const text = document.getElementById('food-input').value.trim();
            const weight = document.getElementById('weight-input').value.trim();
            const imageFile = document.getElementById('image-input').files[0];

            if(!text && !imageFile && !weight) {
                alert('Escribe algo, sube una foto o pon tu peso.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = 'Calculando con IA...';
            btn.disabled = true;

            try {
                const energy = getDailyEnergy();
                const energyContext = energy ? `TDEE diario estimado del usuario: ${Math.round(energy.tdee)} kcal. ` : '';
                let prompt = `Actúa como un experto en nutrición. ${energyContext}Analiza esto y devuelve ÚNICAMENTE un objeto JSON estricto sin markdown (sin comillas de código ni explicaciones) con este formato exacto: {"calories": número_entero_estimado, "summary": "breve resumen de 5 palabras"}. Si solo es peso, pon calories a 0. Entrada del usuario: ${text}`;
                
                let contents = [{ text: prompt }];

                if(imageFile) {
                    const b64 = await fileToBase64(imageFile);
                    contents.push({
                        inlineData: {
                            mimeType: imageFile.type,
                            data: b64
                        }
                    });
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: contents }] })
                });

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(rawText);

                const newLog = {
                    date: new Date().toLocaleDateString(),
                    timestamp: Date.now(),
                    text: text || (imageFile ? "Foto de comida" : "Registro de peso"),
                    calories: result.calories || 0,
                    weight: weight ? parseFloat(weight) : null,
                    summary: result.summary || "Comida registrada"
                };

                logs.unshift(newLog);
                localStorage.setItem('nutri_logs', JSON.stringify(logs));

                document.getElementById('food-input').value = '';
                document.getElementById('weight-input').value = '';
                document.getElementById('image-input').value = '';
                document.getElementById('file-name').innerText = 'Ninguna foto';

                updateUI();
            } catch (err) {
                console.error(err);
                alert('Error al conectar con la IA. Revisa tu API Key.');
            } finally {
                btn.innerText = 'Registrar con IA';
                btn.disabled = false;
            }
        }

        function updateUI() {
            const today = new Date().toLocaleDateString();
            const todayLogs = logs.filter(l => l.date === today);
            const todayCals = todayLogs.reduce((acc, l) => acc + l.calories, 0);
            document.getElementById('today-calories').innerHTML = `${todayCals} <span class="text-xs font-normal text-slate-500">kcal</span>`;

            const energy = getDailyEnergy();
            const basalEl = document.getElementById('basal-calories');
            const tdeeEl = document.getElementById('tdee-calories');
            const weightBasisEl = document.getElementById('weight-basis');
            const deficitEl = document.getElementById('weekly-deficit');

            if(energy) {
                basalEl.innerHTML = `${Math.round(energy.tmb)} <span class="text-xs font-normal text-slate-500">kcal</span>`;
                tdeeEl.innerHTML = `${Math.round(energy.tdee)} <span class="text-xs font-normal text-slate-500">kcal</span>`;
                weightBasisEl.innerText = energy.hasRecordedWeight
                    ? `Con tu último peso: ${energy.weight} kg`
                    : `Peso estimado: ${DEFAULT_WEIGHT} kg`;
            } else {
                basalEl.innerText = 'Completa perfil';
                tdeeEl.innerText = 'Completa perfil';
                weightBasisEl.innerText = 'Guarda edad y altura';
            }

            if(!energy) {
                deficitEl.innerText = 'Completa perfil';
                deficitEl.className = 'text-sm font-bold text-slate-400 mt-1';
            } else {
                // Déficit acumulado de los registros guardados usando el TDEE del perfil.
                const totalIngested = logs.reduce((acc, l) => acc + l.calories, 0);
                const uniqueDays = [...new Set(logs.map(l => l.date))].length || 1;
                const totalSpent = uniqueDays * energy.tdee;
                const weeklyDeficit = Math.round(totalSpent - totalIngested);

                deficitEl.innerHTML = `${weeklyDeficit} <span class="text-xs font-normal text-slate-500">kcal</span>`;
                deficitEl.className = `text-2xl font-black mt-1 ${weeklyDeficit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            }

            const listEl = document.getElementById('logs-list');
            listEl.innerHTML = logs.map(l => `
                <div class="bg-slate-900 border border-slate-800/60 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-slate-200">${l.text}</p>
                        <p class="text-slate-500">${l.date} ${l.weight ? `• ⚖️ ${l.weight}kg` : ''}</p>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-emerald-400">+${l.calories} kcal</span>
                    </div>
                </div>
            `).join('');
        }

        async function generateWeeklyReview() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) { alert('Configura tu API Key primero.'); return; }
            
            const reviewBox = document.getElementById('ai-review-box');
            reviewBox.classList.remove('hidden');
            reviewBox.innerText = 'Analizando tu semana tipo Spotify Wrapped...';

            try {
                const energy = getDailyEnergy();
                const energyContext = energy
                    ? `El TDEE diario estimado es ${Math.round(energy.tdee)} kcal; úsalo como referencia al recomendar comidas. `
                    : '';
                const prompt = `Analiza estos registros nutricionales de un estudiante y haz un resumen estilo "Spotify Wrapped": menciona su mayor acierto, su mayor pecado/exceso y recomienda una mejora concreta en sus comidas usando su gasto diario como referencia. ${energyContext}Datos: ${JSON.stringify(logs)}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                reviewBox.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                reviewBox.innerText = 'Error al generar el resumen.';
            }
        }

        updateUI();
    </script>
</body>
</html>
